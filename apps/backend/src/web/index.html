<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom</title>
  <link rel="icon" type="image/jpeg" href="https://loom-static.arunnya.com/loom.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<body id="app">
  <div class="flex mx-auto justify-center items-center gap-3 py-4">
    <img src="https://loom-static.arunnya.com/loom.jpg" class="w-10 h-10 rounded-full border-1" alt="">
    <h1 class="font-bold inter text-2xl">Loom Server</h1>
  </div>
</body>

<script type="module">
  import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

  createApp({
    setup() {
      const message = ref('Hello Vue!')
      return {
        message,
        google: true
      }
    }
  }).mount('#app')
</script>
<style>
  .inter {
    font-family: "Inter", sans-serif;
  }
</style>
</html>
