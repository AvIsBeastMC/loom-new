version: '3.8'

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web-react

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/backend
    expose:
      - "3000"
    environment:
      RUN_TYPE: "prod"
    volumes:
      - ./apps/backend/db:/app/apps/backend/db
      - ./apps/backend/assets:/app/apps/backend/assets
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-react:
    build:
      context: .
      dockerfile: ./apps/web-react/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend